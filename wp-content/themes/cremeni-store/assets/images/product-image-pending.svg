<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">Imagem do produto em homologação</title><desc id="desc">Visual temporário CREMENI para produto real cuja fotografia ainda não foi homologada.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3ef"/><stop offset="1" stop-color="#f7f5ef"/></linearGradient></defs><rect width="900" height="900" fill="url(#bg)"/><rect x="110" y="110" width="680" height="680" rx="54" fill="#fff" stroke="#d9dedb" stroke-width="3"/><g transform="translate(260 250)"><rect x="0" y="0" width="160" height="54" rx="10" fill="#285c4b" transform="skewX(-18)"/><rect x="130" y="72" width="160" height="54" rx="10" fill="#c69a5b" transform="skewX(-18)"/></g><text x="450" y="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" fill="#18221f">CREMENI</text><text x="450" y="575" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#285c4b">PRODUTO REAL</text><text x="450" y="625" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#65706b">IMAGEM EM HOMOLOGAÇÃO</text></svg>