name: Qualidade Storefront

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/storefront/**'
      - '.github/workflows/storefront.yml'

jobs:
  build-storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Instalar dependências
        run: npm install --package-lock-only && npm ci
      - name: Build Next.js
        run: npm run build
